<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Hipoteca Conjunta - Cloud Realtime</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-surface: #111a28;
      --bg-card: #142032;
      --primary: #10b981;
      --primary-hover: #059669;
      --text-main: #f9fafb;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--bg-surface); border-bottom: 1px solid var(--border-color); padding: 16px; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 18px; font-weight: 700; color: #34d399; }
    .badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; background: rgba(16,185,129,0.15); color: #34d399; font-weight: 600; }
    main { flex: 1; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; }
    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    .btn { background: var(--primary); color: #000; border: none; padding: 12px 20px; font-weight: 700; border-radius: 10px; cursor: pointer; width: 100%; font-size: 14px; transition: background 0.2s; }
    .btn:hover { background: var(--primary-hover); color: #fff; }
    .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text-main); margin-top: 10px; }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); }
    .input-group { margin-bottom: 15px; }
    label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
    input { width: 100%; padding: 12px; background: #0c130d; border: 1px solid #2d4430; border-radius: 8px; color: #fff; font-size: 14px; }
    input:focus { outline: none; border-color: var(--primary); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .stat-val { font-size: 24px; font-weight: 800; color: #34d399; margin-top: 5px; }
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #111a28; border: 1px solid var(--primary); color: #fff; padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 600; display: none; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 999; padding: 20px; }
    .modal-content { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 20px; width: 100%; max-width: 420px; padding: 24px; }
  </style>
</head>
<body>

  <header>
    <h1>🏠 Hipoteca Conjunta Realtime</h1>
    <div id="auth-status" class="badge">Conectando a Firebase...</div>
  </header>

  <main>
    <div id="auth-view" class="card" style="display: none;">
      <h2 style="margin-bottom: 15px; font-size: 18px;">Iniciar Sesión / Registro Único</h2>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 15px;">Tus datos se sincronizan al instante en la nube de Firebase en todos tus dispositivos.</p>
      <div class="input-group">
        <label>Correo Electrónico</label>
        <input type="email" id="user-email" placeholder="ejemplo@correo.com">
      </div>
      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" id="user-pwd" placeholder="Mínimo 4 caracteres">
      </div>
      <button class="btn" onclick="handleAuthLogin()">Entrar o Registrarse</button>
    </div>

    <div id="app-view" style="display: none;">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <div>
            <div style="font-size: 12px; color: var(--text-muted);">Usuario Activo</div>
            <div id="current-user-display" style="font-weight: 700; color: #34d399; font-size: 14px;">--</div>
          </div>
          <button class="btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 12px;" onclick="handleLogout()">Cerrar Sesión</button>
        </div>
      </div>

      <div class="grid">
        <div class="card">
          <label>Capital Inicial (€)</label>
          <input type="number" id="inp-capital" value="180000" oninput="triggerSave()">
          <div class="stat-val" id="lbl-capital">180.000 €</div>
        </div>
        <div class="card">
          <label>Tipo de Interés (%)</label>
          <input type="number" step="0.1" id="inp-rate" value="2.5" oninput="triggerSave()">
          <div class="stat-val" id="lbl-rate">2.5 %</div>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-bottom: 12px; font-size: 15px;">Registro de Pagos / Cuotas</h3>
        <div class="input-group">
          <label>Concepto / Mes</label>
          <input type="text" id="inp-payment-name" placeholder="Ej: Cuota Enero 2024">
        </div>
        <div class="input-group">
          <label>Importe Cuota (€)</label>
          <input type="number" id="inp-payment-amount" placeholder="600">
        </div>
        <button class="btn" onclick="addPayment()">Añadir Pago y Sincronizar en Tiempo Real</button>

        <div style="margin-top: 20px;">
          <h4 style="font-size: 13px; color: var(--text-muted); margin-bottom: 8px;">Historial de Pagos Sincronizados:</h4>
          <div id="payments-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="toast">Notificación</div>

  <!-- FIREBASE 10 SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      projectId: "sacred-acronym-bp497",
      appId: "1:921561338431:web:b9c52c02c3292b95425e8a",
      apiKey: "AIzaSyC_gO0xNycwLrXqK7UrBN_bXt6ceVhz0uk",
      authDomain: "sacred-acronym-bp497.firebaseapp.com",
      firestoreDatabaseId: "ai-studio-cb0127ac-95c8-43f4-ba7c-4211960b1661",
      storageBucket: "sacred-acronym-bp497.firebasestorage.app",
      messagingSenderId: "921561338431"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app, firebaseConfig.firestoreDatabaseId);

    window.fb = { db, doc, setDoc, onSnapshot, getDoc };

    signInAnonymously(auth).then(() => {
      document.getElementById('auth-status').textContent = '● Firebase Conectado';
      initAppReady();
    }).catch(err => {
      document.getElementById('auth-status').textContent = '⚠️ Error Auth Firebase';
      console.error(err);
      initAppReady();
    });
  </script>

  <script>
    let currentUser = localStorage.getItem('hipoteca_user') || '';
    let unsubscribeSnapshot = null;
    let appState = {
      capital: 180000,
      rate: 2.5,
      payments: []
    };
    let isRemoteUpdate = false;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }

    function initAppReady() {
      if (currentUser) {
        document.getElementById('auth-view').style.display = 'none';
        document.getElementById('app-view').style.display = 'block';
        document.getElementById('current-user-display').textContent = currentUser;
        startFirestoreSync(currentUser);
      } else {
        document.getElementById('auth-view').style.display = 'block';
        document.getElementById('app-view').style.display = 'none';
      }
    }

    async function handleAuthLogin() {
      const email = document.getElementById('user-email').value.trim().toLowerCase();
      const pwd = document.getElementById('user-pwd').value.trim();
      if (!email) {
        showToast('Introduce un correo electrónico');
        return;
      }
      currentUser = email;
      localStorage.setItem('hipoteca_user', currentUser);
      showToast('¡Sesión iniciada como ' + currentUser + '!');
      initAppReady();
    }

    function handleLogout() {
      if (unsubscribeSnapshot) unsubscribeSnapshot();
      localStorage.removeItem('hipoteca_user');
      currentUser = '';
      window.location.reload();
    }

    function startFirestoreSync(userEmail) {
      if (!window.fb) {
        setTimeout(() => startFirestoreSync(userEmail), 500);
        return;
      }
      const { db, doc, onSnapshot, setDoc, getDoc } = window.fb;
      const docRef = doc(db, 'users', userEmail);

      // Check / init document
      getDoc(docRef).then(snap => {
        if (!snap.exists()) {
          setDoc(docRef, { state: appState, updatedAt: Date.now() });
        }
      });

      // Realtime listener
      unsubscribeSnapshot = onSnapshot(docRef, docSnap => {
        if (docSnap.exists() && !isRemoteUpdate) {
          const data = docSnap.data();
          if (data && data.state) {
            isRemoteUpdate = true;
            appState = data.state;
            renderUI();
            isRemoteUpdate = false;
            showToast('🔄 Sincronizado en tiempo real desde la nube');
          }
        }
      });
    }

    function triggerSave() {
      if (isRemoteUpdate || !currentUser || !window.fb) return;
      appState.capital = Number(document.getElementById('inp-capital').value) || 0;
      appState.rate = Number(document.getElementById('inp-rate').value) || 0;

      document.getElementById('lbl-capital').textContent = appState.capital.toLocaleString() + ' €';
      document.getElementById('lbl-rate').textContent = appState.rate + ' %';

      const { db, doc, setDoc } = window.fb;
      setDoc(doc(db, 'users', currentUser), {
        state: appState,
        updatedAt: Date.now()
      }).catch(err => console.error(err));
    }

    function addPayment() {
      const name = document.getElementById('inp-payment-name').value.trim();
      const amount = Number(document.getElementById('inp-payment-amount').value) || 0;
      if (!name || amount <= 0) {
        showToast('Introduce concepto y importe válidos');
        return;
      }

      appState.payments.push({ id: Date.now(), name, amount });
      document.getElementById('inp-payment-name').value = '';
      document.getElementById('inp-payment-amount').value = '';

      triggerSave();
      renderUI();
      showToast('Pago añadido y guardado en Firestore');
    }

    function renderUI() {
      document.getElementById('inp-capital').value = appState.capital;
      document.getElementById('inp-rate').value = appState.rate;
      document.getElementById('lbl-capital').textContent = appState.capital.toLocaleString() + ' €';
      document.getElementById('lbl-rate').textContent = appState.rate + ' %';

      const list = document.getElementById('payments-list');
      list.innerHTML = appState.payments.map(p => `
        <div style="background: #0c130d; border: 1px solid #2d4430; padding: 10px 14px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;">
          <div>
            <div style="font-weight: 700; font-size: 13px;">${p.name}</div>
            <div style="font-size: 11px; color: var(--text-muted);">${p.amount.toLocaleString()} €</div>
          </div>
          <button class="btn btn-secondary" style="width: auto; padding: 4px 8px; font-size: 11px; margin: 0; color: #ef4444;" onclick="removePayment(${p.id})">Eliminar</button>
        </div>
      `).join('') || '<div style="font-size: 12px; color: var(--text-muted);">No hay pagos registrados.</div>';
    }

    function removePayment(id) {
      appState.payments = appState.payments.filter(p => p.id !== id);
      triggerSave();
      renderUI();
    }
  </script>
</body>
</html>
